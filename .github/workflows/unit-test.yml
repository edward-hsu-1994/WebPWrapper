name: Unit Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: UnitTest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore packages
        run: dotnet restore src/WebPWrapper.Test/WebPWrapper.Test.csproj
      - name: Restore integration test packages
        run: dotnet restore src/WebPWrapper.IntegrationTest/WebPWrapper.IntegrationTest.csproj
      - name: Build
        run: dotnet build src/WebPWrapper.Test/WebPWrapper.Test.csproj --configuration Release --no-restore
      - name: Build integration tests
        run: dotnet build src/WebPWrapper.IntegrationTest/WebPWrapper.IntegrationTest.csproj --configuration Release --no-restore
      - name: Unit Test
        run: dotnet test src/WebPWrapper.Test/WebPWrapper.Test.csproj --configuration Release --no-build
      - name: Integration Test
        run: dotnet test src/WebPWrapper.IntegrationTest/WebPWrapper.IntegrationTest.csproj --configuration Release --no-build