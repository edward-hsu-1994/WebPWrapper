name: Publish To NuGet.org

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  unit-test:
    name: UnitTest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore packages
        run: dotnet restore src/WebPWrapper.Test/WebPWrapper.Test.csproj
      - name: Build
        run: dotnet build src/WebPWrapper.Test/WebPWrapper.Test.csproj --configuration Release --no-restore
      - name: Unit Test
        run: dotnet test src/WebPWrapper.Test/WebPWrapper.Test.csproj --configuration Release --no-build
        env:
          DOTNET_ROLL_FORWARD: Major
  publish:
    name: Build Package And Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore packages
        run: dotnet restore src/WebPWrapper/WebPWrapper.csproj
      - name: Build
        run: dotnet build src/WebPWrapper/WebPWrapper.csproj --configuration Release "/p:Version=${VERSION}" --no-restore
      - name: Pack
        run: dotnet pack src/WebPWrapper/WebPWrapper.csproj --configuration Release "/p:Version=${VERSION}" --no-build --output .
      - name: Publish to NuGet.org
        run: dotnet nuget push "WebPWrapper.${VERSION}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${NUGET_TOKEN}"
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}