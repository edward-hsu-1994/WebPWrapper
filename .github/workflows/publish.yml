name: Publish To NuGet.org

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  unit-test:
    name: UnitTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 6.0.x
      - name: Restore packages
        run: dotnet restore
        working-directory: src
      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: src
      - name: Unit Test
        run: dotnet test --configuration Release --no-build
        working-directory: src
  publish:
    name: Build Package And Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 6.0.x
      - name: Restore packages
        run: dotnet restore
        working-directory: src
      - name: Build
        run: dotnet build --configuration Release /p:Version=${VERSION} --no-restore
        working-directory: src/WebPWrapper
      - name: Pack
        run: dotnet pack --configuration Release /p:Version=${VERSION} --no-build --output .
        working-directory: src/WebPWrapper
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        run: dotnet nuget push WebPWrapper.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
        working-directory: src/WebPWrapper